name: Backup Restore Game-Day

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameday-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bash syntax check
        run: |
          bash -n scripts/run-backup-restore-gameday.sh
          bash -n scripts/smoke-backup-restore-gameday.sh

      - name: Smoke backup and restore game-day
        run: ./scripts/smoke-backup-restore-gameday.sh
