name: Blocked-Label Sweep

# Execution-state truth (honua-devops#167, first slice): re-verify every open
# `state/blocked` label against the LIVE state of the blockers it cites, and
# publish the result to the job summary.
#
# READ-ONLY. This lane mutates nothing â€” no comments, no label changes, no issue
# edits. The sweeper's `--enforce` flag is a guard that refuses unless
# `ENFORCE_SWEEP=true` is set, and refuses even then because no mutation path is
# implemented yet. It is deliberately not passed anywhere in this workflow.
#
# When enforcement lands in a later slice it must run under a distinct BOT
# IDENTITY, not `github.token` and not a human PAT: every comment and label flip
# the sweep performs has to be attributable to the machine that performed it, per
# the acceptance criteria of #167 ("sweep actions are all logged and attributable
# to the bot identity"). The bot's token replaces SWEEPER_GH_TOKEN at that point.
#
# TOKEN / SCOPE
#   Preferred: the org bot App (`honua-io-bot`) via the org secrets
#   `BOT_APP_ID` + `BOT_APP_PRIVATE_KEY` â€” a short-lived installation token is
#   minted per run (Issues/Metadata/Pull requests read across honua-io), the
#   same pattern as agent-delivery-spec's drift check. This is also the
#   identity enforcement will act as when a later slice implements it.
#   Fallback: `SWEEPER_GH_TOKEN` (repository or organization secret) â€” a PAT
#   able to read the target repos and every repository their issues cite.
#   Cited blockers live in honua-server, honua-sdk-js, honua-iac,
#   honua-demo-infra and others, and `github.token` is scoped to this
#   repository alone, so without one of the above every cross-repo citation
#   resolves as "unresolved" and the report is noise.
#   With neither secret the workflow falls back to `github.token` and sweeps
#   only `honua-io/honua-devops`, saying so in the summary. It never fails for
#   a missing secret.
#
# Configure the target set with the `SWEEP_REPOS` repository variable (a
# space-separated list of `owner/repo`) or the `repos` dispatch input.

on:
  schedule:
    # Daily, offset off the hour to avoid the Actions rush.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      repos:
        description: "Space-separated owner/repo targets. Blank uses the SWEEP_REPOS variable or the built-in default."
        type: string
        required: false
        default: ""
      label:
        description: "Blocked label to verify."
        type: string
        required: false
        default: "state/blocked"
  # The harness itself is gated on PRs that touch it, offline and unauthenticated.
  pull_request:
    paths:
      - "scripts/sweep-blocked-labels.py"
      - "scripts/smoke-blocked-label-sweep.sh"
      - ".github/workflows/blocked-label-sweep.yml"
      - "docs/blocked-label-convention.md"
  push:
    branches: [trunk]
    paths:
      - "scripts/sweep-blocked-labels.py"
      - "scripts/smoke-blocked-label-sweep.sh"
      - ".github/workflows/blocked-label-sweep.yml"
      - "docs/blocked-label-convention.md"

permissions:
  contents: read

concurrency:
  group: blocked-label-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-selftest:
    name: Sweeper syntax + offline self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Syntax check
        run: |
          python3 -m py_compile scripts/sweep-blocked-labels.py
          bash -n scripts/smoke-blocked-label-sweep.sh

      - name: Self-test (citation grammar + stub-gh sweep + enforcement guard)
        run: ./scripts/smoke-blocked-label-sweep.sh

  sweep:
    name: Dry-run sweep
    needs: harness-selftest
    # Never on a pull request: a PR from a fork must not reach a token, and the
    # harness self-test above is the PR-safe floor.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SWEEP_LABEL: ${{ inputs.label || 'state/blocked' }}
      DISPATCH_REPOS: ${{ inputs.repos || '' }}
      VAR_REPOS: ${{ vars.SWEEP_REPOS || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect bot App credentials
        id: creds
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$BOT_APP_ID" ] && [ -n "$BOT_APP_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint bot App read token
        id: app-token
        if: steps.creds.outputs.available == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: honua-io

      # Preference order: bot App installation token, SWEEPER_GH_TOKEN PAT,
      # github.token (same-repo only). Exported via GITHUB_ENV so every later
      # step sees one consistent GH_TOKEN/CROSS_REPO pair; both token values
      # are registered secrets and stay masked in logs.
      - name: Select sweep token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token || '' }}
          PAT_TOKEN: ${{ secrets.SWEEPER_GH_TOKEN || '' }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$APP_TOKEN" ]; then
            echo "GH_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"
            echo "CROSS_REPO=true" >> "$GITHUB_ENV"
            echo "Token source: bot App installation token"
          elif [ -n "$PAT_TOKEN" ]; then
            echo "GH_TOKEN=$PAT_TOKEN" >> "$GITHUB_ENV"
            echo "CROSS_REPO=true" >> "$GITHUB_ENV"
            echo "Token source: SWEEPER_GH_TOKEN"
          else
            echo "GH_TOKEN=$FALLBACK_TOKEN" >> "$GITHUB_ENV"
            echo "CROSS_REPO=false" >> "$GITHUB_ENV"
            echo "Token source: github.token (same-repo only)"
          fi

      - name: Resolve target repositories
        id: targets
        run: |
          set -euo pipefail
          if [[ -n "$DISPATCH_REPOS" ]]; then
            repos="$DISPATCH_REPOS"
          elif [[ -n "$VAR_REPOS" ]]; then
            repos="$VAR_REPOS"
          elif [[ "$CROSS_REPO" == "true" ]]; then
            repos="honua-io/honua-devops honua-io/honua-studio"
          else
            # Same-repo-only mode: github.token cannot read another repository's
            # issues, so sweeping one would report noise instead of truth.
            repos="${GITHUB_REPOSITORY}"
            echo "::notice::Neither BOT_APP_ID/BOT_APP_PRIVATE_KEY nor SWEEPER_GH_TOKEN is configured; sweeping ${GITHUB_REPOSITORY} only. Cross-repo blocker citations will resolve as unresolved."
          fi
          echo "repos=${repos}" >>"$GITHUB_OUTPUT"
          echo "Targets: ${repos}"

      # No `continue-on-error` and no `|| true`. A dry run exits 0 whether or not
      # it finds anything, so a non-zero exit here means the sweep could not run
      # (no auth, no gh) and that must be visible, not swallowed.
      - name: Sweep (dry run â€” reads only, mutates nothing)
        env:
          # Through the environment, never template interpolation: the target list
          # is operator-supplied and must not be able to become shell.
          SWEEP_TARGETS: ${{ steps.targets.outputs.repos }}
        run: |
          set -euo pipefail
          args=()
          for repo in $SWEEP_TARGETS; do
            args+=(--repo "$repo")
          done
          python3 scripts/sweep-blocked-labels.py \
            "${args[@]}" \
            --label "$SWEEP_LABEL" \
            --output artifacts/blocked-label-sweep/report.md \
            --json-out artifacts/blocked-label-sweep/report.json

      - name: Publish report to the job summary
        if: always()
        run: |
          set -euo pipefail
          if [[ -f artifacts/blocked-label-sweep/report.md ]]; then
            if [[ "$CROSS_REPO" != "true" ]]; then
              {
                echo "> [!NOTE]"
                echo "> No cross-repo credential (\`BOT_APP_ID\`/\`BOT_APP_PRIVATE_KEY\` or \`SWEEPER_GH_TOKEN\`) is configured, so this run swept \`${GITHUB_REPOSITORY}\` only and could not resolve cross-repo blocker citations."
                echo
              } >>"$GITHUB_STEP_SUMMARY"
            fi
            cat artifacts/blocked-label-sweep/report.md >>"$GITHUB_STEP_SUMMARY"
          else
            echo "The sweep produced no report; see the step log." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blocked-label-sweep-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/blocked-label-sweep/
          if-no-files-found: warn
