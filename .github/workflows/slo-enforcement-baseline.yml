name: SLO Enforcement Baseline

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede stale pull-request heads only: a newer push to the same PR cancels the
  # in-flight run for the old head. push/schedule/dispatch runs get a unique group
  # (run_id), so trunk and manual runs are never cancelled or coalesced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  slo-enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bash syntax check
        run: |
          bash -n scripts/slo-release-gate.sh
          bash -n scripts/slo-release-watch.sh
          bash -n scripts/smoke-slo-release-gate.sh
          bash -n scripts/smoke-slo-release-watch.sh
          bash -n scripts/validate-slo-assets.sh

      - name: SLO release gate smoke
        run: ./scripts/smoke-slo-release-gate.sh

      - name: SLO release watch smoke
        run: ./scripts/smoke-slo-release-watch.sh

      - name: Validate SLO observability assets
        run: ./scripts/validate-slo-assets.sh
