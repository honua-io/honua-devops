name: Client Compatibility Scoreboard

on:
  pull_request:
  push:
    branches:
      - trunk
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede stale pull-request heads only: a newer push to the same PR cancels the
  # in-flight run for the old head. push/schedule/dispatch runs get a unique group
  # (run_id), so trunk and manual runs are never cancelled or coalesced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-name: compatibility-scoreboard
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      # The smoke script checks the public-content inventory against the checked-in
      # tree. It runs first so generation, when packs exist, cannot hide a
      # checked-in policy failure by rewriting compatibility/scoreboard.
      - name: Smoke scoreboard generator
        run: |
          bash -n scripts/smoke-client-compat-scoreboard.sh
          ./scripts/smoke-client-compat-scoreboard.sh

      # compatibility/releases is not checked in. Running the generator against
      # that absent tree overwrites the populated scoreboard with "releases": []
      # and --hard-fail still exits 0, so the artifact/Pages upload would publish
      # an empty site. Generate only when real packs exist, then refuse an empty
      # matrix before upload. Otherwise publish the checked-in scoreboard.
      - name: Generate scoreboard
        run: |
          set -euo pipefail
          python3 scripts/check-public-compatibility-content.py
          pack_count=0
          if [[ -d compatibility/releases ]]; then
            while IFS= read -r -d '' pack_dir; do
              if [[ -f "$pack_dir/evidence/session.json" || -f "$pack_dir/compatibility-results.json" ]]; then
                pack_count=$((pack_count + 1))
              fi
            done < <(find compatibility/releases -mindepth 2 -maxdepth 2 -type d -print0)
          fi
          if [[ "$pack_count" -eq 0 ]]; then
            echo "No release packs under compatibility/releases; keeping the checked-in scoreboard."
          else
            python3 scripts/generate-client-compat-scoreboard.py \
              --packs-root compatibility/releases \
              --catalog compatibility/clients.catalog.json \
              --output-dir compatibility/scoreboard \
              --hard-fail
            python3 scripts/check-public-compatibility-content.py
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("compatibility/scoreboard/compatibility-matrix.json")
          scoreboard = json.loads(path.read_text(encoding="utf-8"))
          releases = scoreboard.get("releases") or []
          if not releases:
              raise SystemExit(
                  "compatibility-matrix.json has no releases; refusing to publish an empty scoreboard"
              )
          print(f"scoreboard releases: {len(releases)}")
          PY

      - name: Upload static scoreboard artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-scoreboard
          path: compatibility/scoreboard

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && vars.HONUA_DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: compatibility/scoreboard

  deploy-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && vars.HONUA_DEPLOY_PAGES == 'true'
    needs:
      - build-scoreboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
