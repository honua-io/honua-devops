name: Client Compatibility Scoreboard

on:
  pull_request:
  push:
    branches:
      - trunk
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scoreboard:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: compatibility-scoreboard
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Generate scoreboard
        run: |
          bash -n scripts/smoke-client-compat-scoreboard.sh
          python3 scripts/generate-client-compat-scoreboard.py \
            --packs-root compatibility/releases \
            --catalog compatibility/clients.catalog.json \
            --output-dir compatibility/scoreboard \
            --hard-fail

      - name: Smoke scoreboard generator
        run: ./scripts/smoke-client-compat-scoreboard.sh

      - name: Upload static scoreboard artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-scoreboard
          path: compatibility/scoreboard

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && vars.HONUA_DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: compatibility/scoreboard

  deploy-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && vars.HONUA_DEPLOY_PAGES == 'true'
    needs:
      - build-scoreboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
