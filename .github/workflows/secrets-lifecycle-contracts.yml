name: Secrets Lifecycle Contracts

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

jobs:
  secrets-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n scripts/rotate-operator-secrets.sh
          bash -n scripts/revoke-operator-secrets.sh
          bash -n scripts/smoke-secret-lifecycle.sh

      - name: Smoke secrets lifecycle
        run: ./scripts/smoke-secret-lifecycle.sh
