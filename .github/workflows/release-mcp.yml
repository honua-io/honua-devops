name: Release MCP operator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-binary:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            extension: tar.gz
          - runner: macos-14
            rid: osx-x64
            extension: tar.gz
          - runner: macos-14
            rid: osx-arm64
            extension: tar.gz
          - runner: windows-latest
            rid: win-x64
            extension: zip
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained MCP binary
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $publishDir = Join-Path $PWD "artifacts/publish/$rid"
          dotnet restore src/Honua.DevOps.Agent/Honua.DevOps.Agent.csproj `
            --runtime $rid `
            --force-evaluate `
            -p:RestoreLockedMode=false `
            -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish src/Honua.DevOps.Agent/Honua.DevOps.Agent.csproj `
            --configuration Release `
            --runtime $rid `
            --self-contained true `
            --no-restore `
            --output $publishDir `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $assetDir = Join-Path $PWD 'artifacts/release'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $assetBase = "honua-devops-$rid"
          if ('${{ matrix.extension }}' -eq 'zip') {
            $asset = Join-Path $assetDir "$assetBase.zip"
            Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $asset
          } else {
            $asset = Join-Path $assetDir "$assetBase.tar.gz"
            tar -czf $asset -C $publishDir .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($asset))" |
            Set-Content -NoNewline -Encoding utf8 "$asset.sha256"

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: honua-devops-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build SDK-free runtime container
        run: docker build --tag honua-devops:mcp-release-check .

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-binary, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/release

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --generate-notes --title $tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem artifacts/release -Recurse -File | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
