name: DevOps Baseline Contracts

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

jobs:
  smoke-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce maintained documentation command policy
        run: |
          if git grep -n -i -w curl -- '*.md' '*.mdx' '*.rst' '*.txt'; then
            echo "::error::Maintained documentation must use supported SDK, CLI, or API-reference workflows."
            exit 1
          fi

      - name: Bash syntax check
        run: |
          bash -n scripts/check-terraform-secrets.sh
          bash -n scripts/smoke-contract.sh
          bash -n scripts/smoke-contract-smoke.sh
          bash -n scripts/smoke-provisioning-contracts.sh
          bash -n scripts/fault-injection/*.sh

      - name: Smoke contract self-test
        run: ./scripts/smoke-contract-smoke.sh

      # Guards the honua-devops#147 invariant that every provisioning contract is
      # embedded, and therefore actually enforced on write rather than merely
      # published. Needs no .NET, network or credentials.
      - name: Provisioning contract smoke
        run: ./scripts/smoke-provisioning-contracts.sh
