name: Desired State Validation

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desired-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Validate desired-state objects
        run: ./scripts/validate-desired-state.sh --configuration Release

      - name: Smoke scaffolded desired-state tree
        run: ./scripts/smoke-desired-state-scaffold.sh
