name: Desired State Validation

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede stale pull-request heads only: a newer push to the same PR cancels the
  # in-flight run for the old head. push/schedule/dispatch runs get a unique group
  # (run_id), so trunk and manual runs are never cancelled or coalesced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desired-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Validate desired-state objects
        run: ./scripts/validate-desired-state.sh --configuration Release

      - name: Smoke scaffolded desired-state tree
        run: ./scripts/smoke-desired-state-scaffold.sh
