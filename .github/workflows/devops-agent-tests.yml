name: DevOps Agent Tests

# Runs the Honua.DevOps.Agent xUnit suite (rollback planner, fault injection,
# deploy/upgrade toolkit, operator flow) on every PR and push to trunk.
#
# Rationale: the DevOps AI operator surface carries the release "operate" story
# (health-gated fix-forward convergence). Its unit tests must actually execute in
# CI, not merely build. Live/integration tests self-gate on
# HONUA_DEVOPS_LIVE_INTEGRATION and no-op when it is unset, so the full suite is
# safe to run here without credentials or a live backend.

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede stale pull-request heads only: a newer push to the same PR cancels the
  # in-flight run for the old head. push/schedule/dispatch runs get a unique group
  # (run_id), so trunk and manual runs are never cancelled or coalesced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/Honua.DevOps.Agent.Tests/Honua.DevOps.Agent.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=devops-agent-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devops-agent-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
