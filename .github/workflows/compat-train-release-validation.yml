name: Compatibility Train Release Validation

# On PR/push this lane only proves the gates themselves are correct: bash -n + the
# two smoke self-tests exercise the pass path and every block path entirely offline.
#
# workflow_dispatch runs the REAL manifest-driven validator against a supplied
# release-train manifest (URL or, by default, the committed 2026-05 Preview
# example) and ATTACHES the resulting evidence bundle + release notes to the run
# (step summary + uploaded artifact) so the bundle output is attached to the
# release gate per honua-devops#41. Default mode is advisory so a still-gapped
# preview manifest produces and publishes its evidence bundle without failing the
# dispatch; set mode=live to fail the run on any gap.

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "URL of the canonical release-train manifest (honua-server/release/honua-<id>.json). When empty, the committed 2026-05 Preview example bundle's source manifest path is used as a local example."
        required: false
      mode:
        description: "Validation mode: advisory (publish bundle, never fail the dispatch) or live (fail on any gap)."
        required: false
        default: advisory

permissions:
  contents: read

jobs:
  compat-train-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bash syntax check
        run: |
          bash -n scripts/compat-train-release-gate.sh
          bash -n scripts/smoke-compat-train-release-gate.sh
          bash -n scripts/compat-train-release-validation.sh
          bash -n scripts/smoke-compat-train-release-validation.sh
          bash -n scripts/compat-train-live-probe.sh
          bash -n scripts/smoke-compat-train-live-probe.sh

      - name: Compatibility-train release gate smoke (per-repo live evidence)
        run: ./scripts/smoke-compat-train-release-gate.sh

      - name: Compatibility-train release validation smoke (manifest-driven)
        run: ./scripts/smoke-compat-train-release-validation.sh

      - name: Compatibility-train live-probe smoke (active re-verification)
        run: ./scripts/smoke-compat-train-live-probe.sh

  release-validation-dispatch:
    permissions:
      contents: read
      actions: read # Verify recorded workflow-run conclusions.
    name: Validate a candidate manifest and attach the evidence bundle
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: compat-train-release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run manifest-driven release-candidate validation
        env:
          COMPAT_TRAIN_MANIFEST_URL: ${{ github.event.inputs.manifest_url }}
          COMPAT_TRAIN_MODE: ${{ github.event.inputs.mode || 'advisory' }}
          COMPAT_TRAIN_BUNDLE_OUTPUT: release-validation-bundle.json
          COMPAT_TRAIN_RELEASE_NOTES_OUTPUT: release-validation-notes.md
        run: |
          set -euo pipefail
          # When no manifest URL is supplied, fall back to the committed example
          # manifest path recorded by the 2026-05 Preview evidence bundle so the
          # dispatch is self-contained and always produces a bundle.
          if [[ -z "${COMPAT_TRAIN_MANIFEST_URL}" ]]; then
            example="compatibility/scoreboard/release-validation-2026-05-preview.json"
            src="$(jq -r '.generatedFrom // empty' "$example")"
            echo "[INFO] no manifest_url supplied; the committed example bundle was generated from: ${src:-unknown}"
            echo "[INFO] re-deriving an advisory bundle from the committed example manifest surfaces."
            # Reconstruct a minimal manifest from the committed example bundle's
            # checks so the validator runs end-to-end without an external fetch.
            jq '{
              releaseId, channel, observedAt,
              candidate: { ref: .candidate.ref, refSource: .candidate.refSource, image: .candidate.image },
              releaseGates: [ .checks[] | select(.kind=="releaseGate")
                | { id, name, owningRepo, requirement, evidenceState, blockers: (.followUps // []) } ],
              repositoryLanes: [ .checks[] | select(.kind=="repositoryLane")
                | { id, name, owningRepo, requirement, evidenceState, blockers: (.followUps // []) } ],
              releaseLaneCriteria: [ .checks[] | select(.kind=="releaseLaneCriteria")
                | { id, requirement, evidenceState, blockers: (.followUps // []) } ]
            }' "$example" > reconstructed-manifest.json
            COMPAT_TRAIN_MANIFEST_URL="" ./scripts/compat-train-release-validation.sh reconstructed-manifest.json
          else
            ./scripts/compat-train-release-validation.sh
          fi

      - name: Active live-probe re-verification of the candidate
        # The manifest evaluator above transcribes the manifest's recorded
        # evidenceState. This step ACTIVELY re-verifies what the runner can
        # actually reach: it re-fetches every cited GitHub Actions run conclusion
        # with the runner's GITHUB_TOKEN, and (when a base URL / chart is wired)
        # smokes the server/Helm surfaces. Surfaces needing live cloud/creds are
        # reported BLOCKED with their missing dependency — never faked green.
        # Runs only when a real manifest_url is supplied (the reconstructed
        # example manifest carries no live run URLs to re-verify).
        if: ${{ github.event.inputs.manifest_url != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HONUA_PROBE_MANIFEST_URL: ${{ github.event.inputs.manifest_url }}
          HONUA_PROBE_MODE: ${{ github.event.inputs.mode || 'advisory' }}
          HONUA_PROBE_BUNDLE_OUTPUT: live-probe-bundle.json
          # Wire these to activate the creds-gated probes once infra exists:
          HONUA_PROBE_BASE_URL: ${{ vars.HONUA_PROBE_BASE_URL }}
          HONUA_PROBE_HELM_CHART: ${{ vars.HONUA_PROBE_HELM_CHART }}
        run: ./scripts/compat-train-live-probe.sh

      - name: Append release notes to step summary
        if: ${{ always() }}
        run: |
          if [[ -f release-validation-notes.md ]]; then
            cat release-validation-notes.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f live-probe-bundle.json ]]; then
            {
              echo ""
              echo "## Active live-probe re-verification"
              jq -r '"- probes: \(.summary.passed) passed, \(.summary.failed) failed, \(.summary.blocked) blocked"' live-probe-bundle.json
              echo ""
              jq -r '.probes[] | "- [" + (.state|ascii_upcase) + "] (" + .surface + ") " + .id + " — " + (.detail // "") + (if .missing then " [needs: " + .missing + "]" else "" end)' live-probe-bundle.json
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload release-validation evidence bundle + notes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compat-train-release-validation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            release-validation-bundle.json
            release-validation-notes.md
            live-probe-bundle.json
