name: Demo E2E Verification

# L3 verification: end-to-end demo-workflow checks against the DEPLOYED env.
#
# Two tiers:
#   1. Always (PR/push/dispatch): syntax check + offline self-test (smoke) — no
#      network, no secrets, gates the harness itself.
#   2. Live read-path (scheduled / opt-in dispatch): runs the READ-path
#      assertions against the customer-facing demo (HONUA_DEMO_BASE_URL).
#      Serving writes require a staging target + admin key on explicit dispatch;
#      Pro/AI/export additionally require pro_and_ai_live (see docs/demo-e2e-verification.md).

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      live_read_path:
        description: "Run READ-path assertions against the live demo env"
        required: true
        type: boolean
        default: false
      pro_ai_live:
        description: "Run Pro/Bedrock/export assertions (needs staging write target)"
        required: true
        type: boolean
        default: false
  schedule:
    # Daily live read-path probe of the customer-facing demo (read-only).
    - cron: "23 11 * * *"

permissions:
  contents: read

concurrency:
  group: demo-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-selftest:
    name: Harness syntax + offline self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          bash -n scripts/run-demo-e2e.sh
          bash -n scripts/smoke-demo-e2e.sh
      - name: Self-test (offline stub — pass + fail + guardrail paths)
        run: ./scripts/smoke-demo-e2e.sh

  live-read-path:
    name: Live read-path against deployed demo
    needs: harness-selftest
    # Opt-in gate: only runs on schedule or an explicit dispatch that requests it,
    # and only when an operator has provisioned the demo base URL + opted in via
    # repo variable HONUA_DEMO_E2E_ENABLED=true. Otherwise SKIPPED (neutral),
    # never failing on missing config.
    if: >-
      ${{ (github.event_name == 'schedule' && vars.HONUA_DEMO_E2E_ENABLED == 'true')
          || (github.event_name == 'workflow_dispatch' && inputs.live_read_path) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # READ path — customer-facing. Read-only; the harness never writes here.
      HONUA_DEMO_BASE_URL: ${{ vars.HONUA_DEMO_BASE_URL || 'https://demo.honua.io' }}
      HONUA_DEMO_API_KEY: ${{ secrets.HONUA_DEMO_API_KEY || '' }}
      # WRITE path — separate non-customer-facing staging alias / ephemeral env.
      # Explicit dispatch only; scheduled runs always keep write hops PENDING.
      HONUA_DEMO_WRITE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && vars.HONUA_DEMO_WRITE_BASE_URL || '' }}
      HONUA_DEMO_ADMIN_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.HONUA_DEMO_ADMIN_KEY || '' }}
      HONUA_DEMO_READ_ONLY_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.HONUA_DEMO_READ_ONLY_KEY || '' }}
      HONUA_DEMO_WRITE_SERVICE_ID: ${{ vars.HONUA_DEMO_WRITE_SERVICE_ID || vars.HONUA_DEMO_SERVICE_ID || 'maui-parcels' }}
      HONUA_DEMO_WRITE_LAYER_ID: ${{ vars.HONUA_DEMO_WRITE_LAYER_ID || vars.HONUA_DEMO_LAYER_ID || '1' }}
      HONUA_DEMO_WRITE_MARKER_FIELD: ${{ vars.HONUA_DEMO_WRITE_MARKER_FIELD || 'name' }}
      # Pro/Bedrock/export gate. Default false until those deploys land.
      HONUA_DEMO_PRO_AI_LIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.pro_ai_live) && 'true' || 'false' }}
      HONUA_DEMO_ENV: ${{ vars.HONUA_DEMO_ENV || 'demo' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run deployed-env demo verification harness
        run: ./scripts/run-demo-e2e.sh --env "$HONUA_DEMO_ENV"
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/demo-e2e/
          if-no-files-found: warn
