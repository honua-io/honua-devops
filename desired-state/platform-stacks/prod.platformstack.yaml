apiVersion: honua.io/v1alpha1
kind: PlatformStack
metadata:
  name: platform-stack-prod
  namespace: prod
  labels:
    managed-by: honua-devops
    environment: prod
spec:
  environment: prod
  terraform:
    repository: https://github.com/honua-io/honua-iac
    ref: trunk
    targets:
      - eks
  secretRefs:
    - HONUA_ADMIN_API_KEY
    - HONUA_DB_CONNECTION
