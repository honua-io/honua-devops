# Honua SLO recording rules.
#
# METRIC CONTRACT (honua-release#5). Every series named here must exist in honua-server's
# observability/slo-metric-contract.json, which is generated from — and integration-tested
# against — the server's real /metrics exposition. honua-release's gate-observability runs
# tools/check_metric_contract.py over this file and fails if a name drifts.
#
# Why that guard exists: these rules used to divide by `honua_http_requests_total`, a metric
# honua-server has never emitted. An absent series is not an error in PromQL — rate() over it
# returns an empty vector, sum() of empty is empty, clamp_min(empty, 0.001) is empty, and
# real / empty is empty. So every ratio below produced NO series, every alert built on it was
# permanently silent, and every dashboard panel was blank. Nothing went red.
#
#   denominator  honua_serving_request_duration_ms_count
#                the _count child of the serving-plane latency histogram: one sample per served
#                request that classifies to a Honua protocol. It is the only request-volume
#                series the server exports. Requests that do not classify to a protocol are not
#                counted, so this is "classified serving-plane requests", not "all HTTP requests".
#   numerator    honua_request_error_total
#                every error envelope the server produces, on every surface, whatever HTTP status
#                carried it. The old `{status_code=~"5.."}` filter is gone deliberately: a
#                transport-5xx-only numerator is exactly the blindness honua-devops#113 was opened
#                to fix, because GeoServices returns its errors under HTTP 200 for Esri-client
#                compatibility. Consequence: these are error-ENVELOPE-rate SLOs and include 4xx
#                client errors, not pure server-fault SLOs.
#
# Label note: the histogram's protocol dimension is `honua_protocol` (the exporter sanitizes the
# instrument's dotted `honua.protocol` tag key), NOT `protocol`. Grouping by the wrong label name
# does not error either — it silently collapses every protocol into one series.
#
# The error counter is dimensioned by `service_type` while the duration histogram is dimensioned
# by `honua_protocol`, and their value vocabularies only overlap on the GeoServices family, so the
# error ratios below are deliberately not sliced per protocol. Per-protocol error budgets need the
# server to align those two dimensions first.
groups:
  - name: honua-slo-recording-rules
    interval: 30s
    rules:
      - record: honua:slo:availability:ratio_30d
        expr: |
          1 - (
            sum by (service, environment) (
              rate(honua_request_error_total[30d])
            )
            /
            clamp_min(
              sum by (service, environment) (
                rate(honua_serving_request_duration_ms_count[30d])
              ),
              0.001
            )
          )
      - record: honua:slo:error_rate:ratio_5m
        expr: |
          sum by (service, environment) (
            rate(honua_request_error_total[5m])
          )
          /
          clamp_min(
            sum by (service, environment) (
              rate(honua_serving_request_duration_ms_count[5m])
            ),
            0.001
          )
      - record: honua:slo:latency:p50_ms:5m
        expr: |
          histogram_quantile(
            0.50,
            sum by (le, service, environment, honua_protocol) (
              rate(honua_serving_request_duration_ms_bucket[5m])
            )
          )
      - record: honua:slo:latency:p95_ms:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service, environment, honua_protocol) (
              rate(honua_serving_request_duration_ms_bucket[5m])
            )
          )
      - record: honua:slo:latency:p99_ms:5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, service, environment, honua_protocol) (
              rate(honua_serving_request_duration_ms_bucket[5m])
            )
          )
      - record: honua:slo:backup_success:ratio_24h
        expr: |
          avg by (service, environment) (
            avg_over_time(honua_backup_success_ratio[24h])
          )
      - record: honua:slo:replication_lag_seconds:max_5m
        expr: |
          max by (service, environment) (
            max_over_time(honua_replication_lag_seconds[5m])
          )
      - record: honua:slo:availability:error_budget_remaining_ratio
        expr: |
          clamp_min(
            clamp_max(
              1,
              1 - (
                (1 - honua:slo:availability:ratio_30d)
                /
                (1 - 0.990)
              )
            ),
            0
          )
      - record: honua:slo:error_rate:error_budget_remaining_ratio
        expr: |
          clamp_min(
            clamp_max(
              1,
              1 - (honua:slo:error_rate:ratio_5m / 0.010)
            ),
            0
          )
      - record: honua:slo:burn_rate:5m
        expr: |
          honua:slo:error_rate:ratio_5m / 0.010
      - record: honua:slo:burn_rate:30m
        expr: |
          sum by (service, environment) (
            rate(honua_request_error_total[30m])
          )
          /
          clamp_min(
            sum by (service, environment) (
              rate(honua_serving_request_duration_ms_count[30m])
            ),
            0.001
          )
          /
          0.010
      - record: honua:slo:burn_rate:6h
        expr: |
          sum by (service, environment) (
            rate(honua_request_error_total[6h])
          )
          /
          clamp_min(
            sum by (service, environment) (
              rate(honua_serving_request_duration_ms_count[6h])
            ),
            0.001
          )
          /
          0.010
      # --- In-band / GeoServices error signal (audit S1, #113) ----------------
      # A GeoServices 200+{error} envelope reads as a success at the transport layer, so a
      # 5xx-shaped numerator cannot see it. honua_request_error_total{in_band="true"} and
      # honua_geoservices_error_total (server #2243) expose those errors so the SLO stack,
      # alerts, dashboard, and release gate can. As of honua-release#5 the headline error_rate
      # and burn_rate rules above already include this class; these two rules isolate it so a
      # GeoServices-specific regression is still visible when overall traffic is healthy.
      - record: honua:slo:inband_error_rate:ratio_5m
        expr: |
          sum by (service, environment) (
            rate(honua_request_error_total{in_band="true"}[5m])
          )
          /
          clamp_min(
            sum by (service, environment) (
              rate(honua_serving_request_duration_ms_count[5m])
            ),
            0.001
          )
      - record: honua:slo:geoservices_error_rate:ratio_5m
        expr: |
          sum by (service, environment) (
            rate(honua_geoservices_error_total[5m])
          )
          /
          clamp_min(
            sum by (service, environment) (
              rate(honua_serving_request_duration_ms_count[5m])
            ),
            0.001
          )
      # The "effective" family predates honua-release#5, when the headline rules were
      # transport-5xx-only and a separate combined signal was needed to see in-band errors.
      # The headline rules now count every error envelope, so effective_* is by definition the
      # same number. They are kept as one-line aliases — same series names, one definition of
      # the arithmetic — so the alert rules and dashboards that reference them keep working
      # instead of silently resolving to nothing.
      - record: honua:slo:effective_error_rate:ratio_5m
        expr: |
          honua:slo:error_rate:ratio_5m
      - record: honua:slo:geoservices_error_rate:error_budget_remaining_ratio
        expr: |
          clamp_min(
            clamp_max(
              1,
              1 - (honua:slo:geoservices_error_rate:ratio_5m / 0.010)
            ),
            0
          )
      - record: honua:slo:effective_burn_rate:5m
        expr: |
          honua:slo:burn_rate:5m
      - record: honua:slo:effective_burn_rate:30m
        expr: |
          honua:slo:burn_rate:30m
      - record: honua:slo:effective_burn_rate:6h
        expr: |
          honua:slo:burn_rate:6h
      - record: honua:maintenance_window:active
        expr: |
          max by (service, environment) (
            max_over_time(honua_maintenance_window_active[5m])
          )
