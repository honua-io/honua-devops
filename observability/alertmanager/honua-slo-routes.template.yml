route:
  receiver: slack-warning
  group_by:
    - alertname
    - service
    - environment
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="critical"
      receiver: pagerduty-critical
    - matchers:
        - severity="warning"
      receiver: slack-warning
    - matchers:
        - severity="info"
      receiver: email-info

receivers:
  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: REPLACE_PAGERDUTY_ROUTING_KEY
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        details:
          runbook: '{{ .CommonAnnotations.runbook_url }}'
          environment: '{{ .CommonLabels.environment }}'
          service: '{{ .CommonLabels.service }}'
  - name: slack-warning
    slack_configs:
      - api_url: REPLACE_SLACK_WEBHOOK_URL
        channel: "#honua-alerts"
        title: '{{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
  - name: email-info
    email_configs:
      - to: sre-oncall@example.com
        from: alertmanager@example.com
        smarthost: smtp.example.com:587
        auth_username: alertmanager@example.com
        auth_password: REPLACE_SMTP_PASSWORD
  - name: maintenance-mute

mute_time_intervals:
  - name: scheduled-maintenance-window
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "06:00"
        weekdays:
          - saturday
          - sunday
